<!DOCTYPE html>
<html lang="en">
 
 <!-- For designing the layout and functioning of the page -->
 
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Writing</title>

    <link rel="stylesheet" href="writing_style.css">

    <script src="writing_js.js" defer></script>

  </head>

  <body>

    <header>
      
      <button class="hamburger-icon"> </button>
      <div class="logo"> Flixel </div>
    
    </header>

    <main>
      <div class="row-1">
        <input class="heading-box" type="text" placeholder="Add heading">
        <div class="date-box">
          <label for="start-date">Choose the date:</label>
          <input type="date" id="start-date">
        </div>
      </div>

      <textarea class="text-box" placeholder="Add text here..."></textarea>

      <div class="file-button">

        <button class="buttons">Cancel</button>
        <button class="buttons">Submit</button>

     </div>

    
    </main>

    <footer>
      
      <img src="../assets/background/Flowers.png" alt="a flower decoration" class="footer-flowers">
      <img src="../assets/background/grass.png" alt="a grass decoration" class="footer-grass"> 
   
      <div class="footer-box"></div>
    
    </footer>

  </body>

</html>
