<!DOCTYPE html>
<html lang="en">
 
 <!-- For designing the layout and functioning of the page -->
 
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Writing</title>

    <link rel="stylesheet" href="writing_style.css">

    <script src="writing_js.js" defer></script>

  </head>

  <body>

    <header>
      
      <button class="hamburger-icon">
        <img src="../assets/icons/menu-burger.svg">
      </button>
      <div class="logo"> Flixel </div>
    
    </header>

    <main>

      <div class="popup-container js-popup-container">
       
        <div class="popup-box">
          
          <p>Do you want to remove this entry?</p>
         
          <div class="popup-buttons">
           
            <button class="popup-button js-yes-button">Yes</button>
            <button class="popup-button js-no-button">No</button>
          
          </div>
          
        </div>
      
      </div>
      
      <div class="row-1">
        <input class="heading-box js-heading-box" type="text" placeholder="Add heading">
        <div class="date-box">
          <label for="start-date">Choose the date:</label>
          <input type="date" id="start-date">
        </div>
      </div>

      <textarea class="text-box js-text-box" placeholder="Add text here..."></textarea>

      <div class="file-button">

        <button class="buttons js-button-cancel">Cancel</button>
        <button class="buttons js-button-submit">Submit</button>

     </div>

    
    </main>

    <footer>
      
      <img src="../assets/background/Flowers.png" alt="a flower decoration" class="footer-flowers">
      <img src="../assets/background/grass.png" alt="a grass decoration" class="footer-grass"> 
   
      <div class="footer-box">
        
        <a href="" class="github-icon"><img src="..\assets\icons\github.svg"></a>

        <div class="footer-hyperlinks">
          <a href=""> Readme</a>
          <a href="">GitHub</a>
          <a href="">Details</a>
        </div>

        <div class="copyright">© 2026 Diksha Mukherjee Agarwal. All rights reserved </div>
        <p class="contact">[For inquiries, please reach out on GitHub. Alternatively, you may send a handwritten letter, though response times may vary.]</p>

      </div>
    
    </footer>

  </body>

</html>
