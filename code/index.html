<!DOCTYPE html>
<html lang="en">
 
<!-- For designing the layout and functioning of the page -->
 
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>flixel</title>
   
    <link rel="stylesheet" href="style.css">
   
    <script src="script.js" defer></script>

  </head>

  <!-- Elements which will be visible on the page -->
  
  <body>

   
    <header>

      <button class="hamburger-icon"></button>
      <div class="logo">
        <p>Flixel</p>
      </div>


        <form class="search-box js-search-box">
          <input class="search-bar js-search-bar" type="text" placeholder="What's in your mind?">
          <button class="search-icon" type="submit"></button>
        </form>

    </header>
    
    <main>

      <div class="tree-sketch js-intraBox">

        <img src="../assets/tree/tree.png" alt="a branch of a tree" class="branch">

        <img src="../assets/tree/roots.png" alt="colorful bleed down the tree" class="roots">

        <img src="../assets/tree/pose_down.png" alt="a branch of a tree" class="pose-down">

        <img src="../assets/tree/umbrella.png" alt="a branch of a tree" class="umbrella">

        <img src="../assets/tree/grass_sihouette.png" class="grass-shadow">

        <div class="leaves">

          <img src="../assets/tree/leaf-1.png" class="leaf-1 leaf">
          <img src="../assets/tree/leaf-2.png" class="leaf-2 leaf">
          <img src="../assets/tree/leaf-3.png" class="leaf-3 leaf">
          <img src="../assets/tree/leaf-4.png" class="leaf-4 leaf">
          <img src="../assets/tree/leaf-5.png" class="leaf-5 leaf">
          <img src="../assets/tree/leaf-6.png" class="leaf-6 leaf">
          <img src="../assets/tree/leaf-7.png" class="leaf-7 leaf">
          <img src="../assets/tree/leaf-8.png" class="leaf-8 leaf">
          <img src="../assets/tree/leaf-9.png" class="leaf-9 leaf">
          <img src="../assets/tree/leaf-10.png" class="leaf-10 leaf">
          <img src="../assets/tree/leaf-11.png" class="leaf-11 leaf">
          <img src="../assets/tree/leaf-12.png" class="leaf-12 leaf">

        </div>
      
      </div>

      <div class="div-buttons">
        <button  class="buttons">Start Writing</button>
        <button class="buttons" >Breathe</button>
        <button class="buttons">Open Folder</button>
      </div>

    </main>
   
    <footer>
    
      <div class="footer-box"></div>
      <img src="../assets/background/Flowers.png" alt="a flower decoration" class="footer-flowers">
      <img src="../assets/background/grass.png" alt="a grass decoration" class="footer-grass">
    
    </footer>

  </body>

</html>
