<!DOCTYPE html>
<html lang="en">
 
<!-- For designing the layout and functioning of the page -->
 
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>BreatheSafe</title>
   
    <link rel="stylesheet" href="style.css">
   
    <script src="script.js" defer></script>

  </head>

  <!-- Elements which will be visible on the page -->
  
  <body>

   
    <header>

      <button class="hamburger-icon"></button>
      <div class="logo">
        <p>BreatheSafe...</p>
      </div>


        <form class="search-box">
          <input class="search-bar" type="text" placeholder="What are you Breathing...">
          <button class="search-icon"> </button>
        </form>

    </header>
    
    <main>
      
      <!-- Temporary heading of the main -->
      
      <h1>BreatheSafe Dashboard</h1> 

      <!-- This massive temporary box to force the page to scroll -->
      
      <div style="height: 1000px; background-color: rgba(255,255,255,0.5); margin: 20px; padding: 20px; border-radius: 10px;">
          
        <p>↓ Keep scrolling down to see the footer push away! ↓</p>
          
        <p>Once you see the scrollbar, you know your layout is working perfectly.</p>
      
      </div>
    
    </main>
   
    <footer>
    
      <div class="footer-box"></div>
      <img src="../assets/background/Flowers.png" alt="a flower decoration" class="footer-flowers">
      <img src="../assets/background/grass.png" alt="a grass decoration" class="footer-grass">
    
    </footer>

  </body>

</html>
