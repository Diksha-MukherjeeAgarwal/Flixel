<!DOCTYPE html>
<html lang="en">
 
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Breathe</title>
   
    <link rel="stylesheet" href="breathe_style.css">
   
    <script src="breathe_js.js" defer></script>

  </head>

  
  <body>

   
    <header>
      
      <button class="hamburger-icon"> </button>
      <div class="logo"> Flixel </div>
    
    </header>

    <main>
    
    <div class="count-UI js-count-UI">

      <div class="div-skipbutton"> <button class="js-skip-button">skip</button> </div>
      <div class="div-count js-div-count"></div>

    </div>
   
      <div class="row-1">

        <div class="tree-sketch js-intraBox">

          <img src="../assets/tree/tree.png" alt="a branch of a tree" class="branch">

          <img src="../assets/tree/roots.png" alt="colorful bleed down the tree" class="roots js-roots">

          <img src="../assets/tree/pose_down.png" class="pose-down">

          <!-- <img src="../assets/tree/pose_up.png" class="pose-down"> -->

          <img src="../assets/tree/umbrella.png" alt="a branch of a tree" class="umbrella js-umbrella">

          <img src="../assets/tree/grass_sihouette.png" class="grass-shadow">

          <div class="leaves">

            <img src="../assets/tree/leaf-1.png" class="leaf-1 leaf js-leaf">
            <img src="../assets/tree/leaf-2.png" class="leaf-2 leaf js-leaf">
            <img src="../assets/tree/leaf-3.png" class="leaf-3 leaf js-leaf">
            <img src="../assets/tree/leaf-4.png" class="leaf-4 leaf js-leaf">
            <img src="../assets/tree/leaf-5.png" class="leaf-5 leaf js-leaf">
            <img src="../assets/tree/leaf-6.png" class="leaf-6 leaf js-leaf">
            <img src="../assets/tree/leaf-7.png" class="leaf-7 leaf js-leaf">
            <img src="../assets/tree/leaf-8.png" class="leaf-8 leaf js-leaf">
            <img src="../assets/tree/leaf-9.png" class="leaf-9 leaf js-leaf">
            <img src="../assets/tree/leaf-10.png" class="leaf-10 leaf js-leaf">
            <img src="../assets/tree/leaf-11.png" class="leaf-11 leaf js-leaf">
            <img src="../assets/tree/leaf-12.png" class="leaf-12 leaf js-leaf">

          </div>
        
       
        </div>

        
        <div class="play-buttons">

          <button class="button js-fadeleaves-button">fade leaves</button>
          <button class="button js-glowroots-button">glow roots</button>
          <button class="button js-movehand-button">move hand</button>
         
        </div>
     
      </div>

      <div class="instructions js-instructions">Instructions:
        <br>
        Inhale: When roots fade.
        <br>
        Exhale: When roots glow.
      </div>

      
    </main>
   
    <footer>
    
      <div class="footer-box"></div>
      <img src="../assets/background/Flowers.png" alt="a flower decoration" class="footer-flowers">
      <img src="../assets/background/grass.png" alt="a grass decoration" class="footer-grass">
    
    </footer>

  </body>

</html>
